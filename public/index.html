  function sourceCard(run, source) {
    var tier = source.tier ? TIERS[source.tier] : null;
    var stance = source.stance ? STANCES[source.stance] : '';
    var toggle = source.reachable === false;
    var gs = groupSize(run, source);
    return '<button class="source-card tier-' + (source.tier || 'unknown') + (toggle ? ' unreachable' : '') + '" data-act="open-source" data-id="' + esc(source.id) + '">' +
      '<span class="sc-top">' +
        (tier ? '<span class="badge tone-' + tier.cls + '">' + tier.label + '</span>' : '<span class="tag">待分级</span>') +
        (stance ? '<span class="stance ' + source.stance + '">' + stance + '</span>' : '') +
      '</span>' +
      '<span class="sc-title">' + esc(titleLabel(source)) + '</span>' +
      '<span class="sc-snippet">' + esc(clip(snippetLabel(source), 90)) + '</span>' +
      '<span class="sc-foot"><span>' + esc(siteLabel(source)) + '</span><span>' + fmtDate(source.publishedAt) + '</span></span>' +
      (source.reachable === false ? '<span class="sc-group" style="color:var(--red);background:var(--red-soft)">链接不可达</span>' : '') +
      (source.isOrigin ? '<span class="sc-group">原始出处</span>' : '') +
      (gs > 1 ? '<span class="sc-group">同源 ' + gs + ' 篇</span>' : '') +
    '</button>';
  }

  function claimBlock(run, claim, index) {
    var risk = RISKS[claim.riskLevel] || null;
    var category = claim.category ? (CATS[claim.category] || '') : '';
    var progress = run.claimProgress[claim.id];
    var progressLabel = { queued: '排队中', searching: '搜证中', grading: '分级中', done: '已核查' }[progress] || '';
    var sources = sourceListForClaim(run, claim.id);
    var expanded = !!state.expanded[claim.id];
    var shown = expanded ? sources : sources.slice(0, 7);
    var rest = sources.length - shown.length;
    var body = '';

    if (sources.length === 0) {
      body = (run.status === 'running')
        ? '<div class="skeleton"></div><div class="skeleton"></div>'
        : '<div class="empty-src">本次没有检索到可用来源。</div>';
    } else {
      body = shown.map(function (source) { return sourceCard(run, source); }).join('') +
        (rest > 0 ? '<button class="more-card" data-act="expand-claim" data-id="' + esc(claim.id) + '">还有 ' + rest + ' 条来源<br>点击展开</button>' : '');
    }

    return '<div class="claim-block">' +
      '<div class="claim-head">' +
        '<span class="claim-no">疑点 ' + pad(index + 1) + '</span>' +
        '<p>' + esc(claim.sentence || claim.text) + '</p>' +
        '<span class="claim-tags">' +
          (risk ? '<span class="badge ' + risk.cls + '">' + risk.label + '</span>' : '') +
          (category ? '<span class="tag">' + esc(category) + '</span>' : '') +
          (progressLabel ? '<span class="progress-chip ' + progress + '">' + progressLabel + '</span>' : '') +
        '</span>' +
      '</div>' +
      '<div class="source-grid">' + body + '</div>' +
    '</div>';
  }

  function renderTimeline(run) {
    var stepsByClaim = run.timelines || {};
    var claimIds = Object.keys(stepsByClaim).filter(function (id) { return (stepsByClaim[id] || []).length > 0; });
    if (claimIds.length === 0) {
      return '<section class="card timeline-card"><div class="panel-title">溯源时间线 <span>按发布时间还原</span></div>' +
        (run.status === 'running' ? '<div class="skeleton" style="height:84px"></div>' : '<div class="empty-src">本次未还原出传播时间线。</div>') +
      '</section>';
    }
    var active = state.timelineClaim;
    if (!active || claimIds.indexOf(active) < 0) active = claimIds[0];
    var tabs = claimIds.length > 1 ? '<div class="tl-tabs">' + claimIds.map(function (id) {
      var claim = run.claims.filter(function (item) { return item.id === id; })[0];
      return '<button data-act="timeline-tab" data-id="' + esc(id) + '" class="' + (id === active ? 'on' : '') + '">' + esc(clip(claim ? (claim.sentence || claim.text) : id, 16)) + '</button>';
    }).join('') + '</div>' : '';
    var steps = stepsByClaim[active] || [];
    var stepsHtml = steps.map(function (step) {
      var source = sourceOf(run, step.sourceId);
      var mutated = step.mutation && step.mutation !== '原始出处';
      return '<li class="tl-step' + (mutated ? ' mutated' : '') + '">' +
        '<div class="tl-dot"></div>' +
        '<div class="tl-date">' + fmtDate(step.publishedAt) + '</div>' +
        '<div class="tl-site">' + esc(source ? siteLabel(source) : '来源不详') + '</div>' +
        '<div class="tl-quote">' + esc(step.quote || '暂无摘录') + '</div>' +
        (step.mutation ? '<div class="tl-mutation">' + esc(step.mutation) + '</div>' : '') +
      '</li>';
    }).join('');
    return '<section class="card timeline-card">' +
      '<div class="panel-title">溯源时间线 <span>' + steps.length + ' 步 · 看结论如何走样</span></div>' +
      tabs + '<ol class="timeline">' + stepsHtml + '</ol>' +
    '</section>';
  }

  function renderVerdict(run) {
    if (run.status === 'terminated') {
      return '<section class="card verdict-skeleton"><b>本次办案已中止</b><p>没有生成判决书，也没有产生费用。</p></section>';
    }
    if (!run.verdict) {
      if (run.status === 'error') {
        return '<section class="card verdict-skeleton"><b>未能生成判决</b><p>' + esc(run.fatal || '查证过程中出现错误') + '</p></section>';
      }
      return '<section class="card verdict-skeleton"><b>判决生成中…</b><p>证据齐备后会在这里给出五档判决。</p><div class="skeleton-line" style="width:70%;margin:8px auto"></div></section>';
    }

    var verdict = run.verdict;
    var level = VERDICTS[verdict.level] || VERDICTS.unverified;
    var percent = Math.round((Number(verdict.confidence) || 0) * 100);
    var evidenceState = verdict.evidenceState === 'multi' ? '多方独立证据' : (verdict.evidenceState === 'single' ? '单一来源证据' : (verdict.evidenceState === 'none' ? '无独立证据' : ''));

    var rows = (verdict.claims || []).map(function (item) {
      var claim = run.claims.filter(function (c) { return c.id === item.claimId; })[0];
      var itemLevel = VERDICTS[item.level] || VERDICTS.unverified;
      var citations = (item.citationIds || []).map(function (id) { return sourceOf(run, id); }).filter(Boolean);
      var scriptLabel = item.scriptLabel ? (SCRIPT_LABELS[item.scriptLabel] || item.scriptLabel) : '';
      return '<div class="cv-row">' +
        '<span class="badge tone-' + itemLevel.cls + '">' + itemLevel.label + '</span>' +
        '<div class="cv-main">' +
          '<p>' + esc(claim ? (claim.sentence || claim.text) : item.claimId) + '</p>' +
          '<small>' + esc(item.summary || '') + ' · 置信度 ' + Math.round((Number(item.confidence) || 0) * 100) + '%</small>' +
          ((scriptLabel || item.rewrite || item.conflict) ? '<div class="cv-extra">' +
            (scriptLabel ? '<span class="tag">标签：' + esc(scriptLabel) + '</span>' : '') +
            (item.conflict ? '<span class="tag">冲突：支持 ' + item.conflict.supportIds.length + ' / 反驳 ' + item.conflict.refuteIds.length + '</span>' : '') +
          '</div>' : '') +
          (item.rewrite ? '<div class="cv-extra"><span class="tag">改写：' + esc(item.rewrite) + '</span></div>' : '') +
          (item.conflict ? '<small>' + esc(item.conflict.resolution || '') + '</small>' : '') +
          (citations.length ? '<div class="cv-cites">' + citations.map(function (source) {
            return '<button class="cite" data-act="open-source" data-id="' + esc(source.id) + '">' + esc(siteLabel(source)) + '</button>';
          }).join('') + '</div>' : '') +
        '</div>' +
      '</div>';
    }).join('');

    if (!rows && run.claims.length === 0) rows = '<div class="empty-src">本次没有可核查的疑点。</div>';

    return '<section class="card verdict-card" id="verdict-anchor">' +
      '<div class="verdict-head">' +
        '<div class="stamp" style="background:' + level.color + '">' + level.label + '</div>' +
        '<div class="vh-main">' +
          '<div class="vh-kicker">' + (run.mode === 'scriptcheck' ? '文案体检 · 结案' : '消息查证 · 结案') + '</div>' +
          '<h2>' + esc(verdict.headline || level.label) + '</h2>' +
          '<p>' + esc(verdict.summary || '') + '</p>' +
          '<div class="conf"><span>置信度 ' + percent + '%</span><div class="conf-bar"><i style="width:' + percent + '%"></i></div>' +
            (evidenceState ? '<span class="evidence-state">' + evidenceState + '</span>' : '') +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="claim-verdicts">' + rows + '</div>' +
      (verdict.rebuttalCard ? '<div class="rebuttal">' +
        '<h4>可转发 · 辟谣卡</h4>' +
        '<b>' + esc(verdict.rebuttalCard.title) + '</b>' +
        '<p>' + esc(verdict.rebuttalCard.body) + '</p>' +
        '<div class="rb-actions">' +
          '<button class="btn btn-sm" data-act="copy-rebuttal">复制辟谣卡</button>' +
          '<button class="btn btn-sm" data-act="export-md">' + ICONS.doc + '导出 Markdown</button>' +
          '<a class="btn btn-sm" href="/api/report/' + encodeURIComponent(run.caseId || '') + '?format=md" target="_blank" rel="noopener">服务端报告</a>' +
          '<button class="btn btn-sm btn-primary" data-act="home">再查一条</button>' +
        '</div>' +
      '</div>' : '') +
    '</section>';
  }

  function renderCase() {
    var run = state.run;
    if (!run) { state.screen = 'home'; return renderHome(); }

    var running = run.status === 'running';
    var statusText = running
      ? '进行中 · <span id="elapsed">' + fmtClock(Date.now() - run.startedAt) + '</span>'
      : (run.status === 'done' ? (run.fromHistory ? '已归档' : '已结案 · 用时 ' + fmtClock(run.closedAt - run.startedAt))
        : (run.status === 'terminated' ? '已中止' : '查证失败'));

    var stagesHtml = STAGES.map(function (stage, index) {
      var status = stageState(run, stage.key);
      return '<li class="stage ' + status + '">' +
        '<span class="stage-no" style="' + (status === 'done' ? '' : '') + '">' + (status === 'done' ? '✓' : (index + 1)) + '</span>' +
        '<span class="stage-body"><b>' + stage.label + '</b><small>' + esc(stageMessage(run, stage.key)) + '</small></span>' +
      '</li>';
    }).join('');

    var recentLogs = (run.logs || []).slice(-6);
    var feedHtml = recentLogs.length ? '<ul class="feed">' + recentLogs.map(function (log) {
      var label = (STAGES.filter(function (stage) { return stage.key === log.stage; })[0] || {}).label || log.stage;
      return '<li class="' + log.status + '"><time>' + fmtClock(log.at - run.startedAt) + '</time><span>' + esc(label + ' · ' + log.message) + '</span></li>';
    }).join('') + '</ul>' : '<div class="empty-src">等待立案事件…</div>';

    var statsHtml = run.stats ? '<div class="card side-card"><div class="panel-title">本次查证</div><div class="stats-grid">' +
      '<div class="stat"><b>' + (run.stats.apiCalls || 0) + '</b><span>API 调用</span></div>' +
      '<div class="stat"><b>' + (run.stats.sourcesVisited || 0) + '</b><span>访问来源</span></div>' +
      '<div class="stat"><b>' + (run.stats.independentWitnesses || 0) + '</b><span>独立证人</span></div>' +
      '<div class="stat"><b>' + ((run.stats.durationMs || 0) / 1000).toFixed(1) + 's</b><span>查证耗时</span></div>' +
    '</div></div>' : '';

    var billingHtml = run.billing ? '<div class="card side-card"><div class="panel-title">结算</div>' +
      '<div class="billing-line"><span>单价</span><b>' + (run.billing.pricePerClaim || 8) + ' 积分 / 疑点</b></div>' +
      '<div class="billing-line"><span>查证疑点</span><b>' + ((run.billing.checkedClaimIds || []).length) + ' 个</b></div>' +
      '<div class="billing-line"><span>扣除</span><b>' + (run.billing.charged || 0) + ' 积分</b></div>' +
      '<div class="billing-line"><span>退回</span><b>' + (run.billing.refunded || 0) + ' 积分</b></div>' +
      '<div class="billing-line"><span>实际净扣</span><b>' + ((run.billing.charged || 0) - (run.billing.refunded || 0)) + ' 积分</b></div>' +
      ((run.billing.refundClaimIds || []).length ? '<p class="side-note">' + (run.billing.refundClaimIds.length) + ' 个疑点无可核对证据或未完成核查，已部分退款。</p>' : '') +
    '</div>' : '';

    var errorBanner = (run.status === 'error' && run.fatal)
      ? '<div class="banner banner-error"><span>' + esc(run.fatal) + '</span><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-sm" data-act="retry-run">重试</button><button class="btn btn-sm" data-act="home">返回首页</button></span></div>'
      : '';
    var terminatedBanner = run.status === 'terminated'
      ? '<div class="banner banner-terminated"><span>本次办案已中止，所有在途请求已取消，本次未产生费用。</span><button class="btn btn-sm" data-act="home">返回首页重新立案</button></div>'
      : '';
    var warnBanner = (run.status === 'running' && run.errors.length)
      ? '<div class="banner banner-warn"><span>' + esc(run.errors[run.errors.length - 1]) + '（可恢复，继续查证中）</span></div>'
      : '';

    var claimsHtml = run.claims.length
      ? run.claims.map(function (claim, index) { return claimBlock(run, claim, index); }).join('')
      : (run.status === 'running' ? '<div class="skeleton"></div><div class="skeleton" style="margin-top:10px"></div>' : '<div class="empty-src">本次没有拆出可核查的疑点。</div>');

    var groupCount = run.groups.filter(function (group) { return group.memberIds && group.memberIds.length > 1; }).length;

    return '' +
    '<div class="case-page">' +
      '<header class="case-bar"><div class="wrap bar-inner">' +
        '<button class="bar-home" data-act="home">' + ICONS.back + 'AI 侦探社</button>' +
        '<div class="bar-meta">' +
          '<span class="case-id">' + esc(run.caseId || '等待案件编号') + '</span>' +
          '<span class="badge">' + (run.mode === 'scriptcheck' ? '文案体检' : '消息查证') + '</span>' +
          (run.inputImage ? '<span class="badge">图片立案</span>' : '') +
          (run.fromHistory ? '<span class="badge">本机卷宗</span>' : '') +
        '</div>' +
        '<div class="bar-actions">' +
          '<span class="status-line">' + (running ? '<span class="live-dot"></span>' : '') + statusText + '</span>' +
          (running ? '<button class="btn btn-danger" data-act="terminate">■ 中止</button>' : '') +
        '</div>' +
      '</div></header>' +

      '<div class="wrap case-wrap">' +
        errorBanner + terminatedBanner + warnBanner +
        '<div class="case-grid">' +
          '<aside class="side">' +
            '<div class="card side-card">' +
              '<div class="panel-title">报案内容 <span>' + fmtDate(run.createdAt) + '</span></div>' +
              '<div class="case-input">' + esc(run.input) + '</div>' +
              (run.inputImage ? '<img class="case-thumb" src="' + run.inputImage + '" alt="立案截图">' : '') +
              '<div class="case-input-meta"><span class="tag">' + run.claims.length + ' 个疑点</span><span class="tag">' + run.sources.length + ' 条来源</span>' + (groupCount ? '<span class="tag">' + groupCount + ' 个同源组</span>' : '') + '</div>' +
            '</div>' +
            '<div class="card side-card">' +
              '<div class="panel-title">查证进度 ' + (running ? '<span class="live-tag">进行中</span>' : '<span>' + (run.status === 'done' ? '已结案' : '已结束') + '</span>') + '</div>' +
              '<ol class="stages">' + stagesHtml + '</ol>' +
            '</div>' +
            '<div class="card side-card"><div class="panel-title">办案播报</div>' + feedHtml + '</div>' +
            statsHtml +
            billingHtml +
          '</aside>' +
          '<div class="main">' +
            '<section class="card evidence-card">' +
              '<div class="evidence-top"><h2>证据墙</h2><span>' + run.sources.length + ' 条来源 · ' + groupCount + ' 个同源组</span></div>' +
              claimsHtml +
            '</section>' +
            renderTimeline(run) +
            renderVerdict(run) +
            (run.verdict ? '<p class="foot">判决依据 ' + run.sources.length + ' 条来源生成 · 点击来源卡片查看摘录与链接</p>' : '') +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  /* ---------- 覆盖层 ---------- */
  function renderOverlays() {
    var html = '';
    var run = state.run;
    if (state.drawer && run) {
      var source = sourceOf(run, state.drawer.sourceId);
      if (source) {
        var tier = source.tier ? TIERS[source.tier] : null;
        var group = groupFor(run, source);
        var members = group && group.memberIds ? group.memberIds.map(function (id) { return sourceOf(run, id); }).filter(Boolean) : [];
        var claim = run.claims.filter(function (item) { return item.id === source.claimId; })[0];
        html += '<div class="scrim" data-act="close-drawer"></div><aside class="drawer" role="dialog" aria-label="来源详情">' +
          '<div class="drawer-head"><h3>来源详情</h3><button class="icon-btn" data-act="close-drawer" aria-label="关闭">' + ICONS.close + '</button></div>' +
          '<div class="drawer-site">' +
            (tier ? '<span class="badge tone-' + tier.cls + '">' + tier.label + '</span>' : '<span class="tag">待分级</span>') +
            '<span>' + esc(siteLabel(source)) + '</span>' +
            (source.stance ? '<span class="stance ' + source.stance + '">' + STANCES[source.stance] + '</span>' : '') +
            (source.reachable === false ? '<span class="badge tone-false">链接不可达</span>' : '') +
          '</div>' +
          '<div class="drawer-title">' + esc(titleLabel(source)) + '</div>' +
          '<div class="drawer-snippet">' + esc(snippetLabel(source)) + '</div>' +
          '<div class="drawer-meta">' +
            '<div><span>对应疑点</span><b>' + esc(claim ? clip(claim.sentence || claim.text, 26) : '—') + '</b></div>' +
            '<div><span>发布时间</span><b>' + fmtDateTime(source.publishedAt) + '</b></div>' +
            '<div><span>检索方向</span><b>' + (source.direction === 'pro' ? '正方检索' : (source.direction === 'con' ? '反方检索' : '—')) + '</b></div>' +
            '<div><span>检索式</span><b>' + esc(clip(source.query || '—', 34)) + '</b></div>' +
            (group && members.length > 1 ? '<div><span>同源组</span><b>' + members.length + ' 篇（合并计为 1 个证人）</b></div>' : '') +
          '</div>' +
          (isSafeUrl(source.url) && source.reachable !== false
            ? '<a class="drawer-link" href="' + esc(source.url) + '" target="_blank" rel="noopener noreferrer">打开原始链接 ↗</a>'
            : '<p class="side-note">原始链接不可用或未通过校验。</p>') +
          (members.length > 1 ? '<div class="group-box"><h4>同源转载</h4>' + members.map(function (member) {
            return '<button data-act="switch-source" data-id="' + esc(member.id) + '">' + (member.id === source.id ? '● ' : '') + esc(clip(titleLabel(member), 30)) + ' · ' + esc(siteLabel(member)) + '</button>';
          }).join('') + '</div>' : '') +
        '</aside>';
      }
    }
    if (state.modal) {
      html += '<div class="modal-wrap"><div class="scrim" data-act="modal-cancel"></div><div class="modal card" role="dialog" aria-modal="true">' +
        '<h3>' + esc(state.modal.title) + '</h3><p>' + esc(state.modal.body) + '</p>' +
        '<div class="modal-actions">' +
          (state.modal.cancelText !== null ? '<button class="btn" data-act="modal-cancel">' + esc(state.modal.cancelText || '取消') + '</button>' : '') +
          '<button class="btn ' + (state.modal.danger ? 'btn-danger' : 'btn-primary') + '" data-act="modal-ok">' + esc(state.modal.okText || '确定') + '</button>' +
        '</div></div></div>';
    }
    $('#overlays').innerHTML = html;
  }

  /* ---------- 交互工具 ---------- */
  var toastTimer = null;
  function toast(message) {
    var element = $('#toast');
    element.textContent = message;
    element.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { element.classList.remove('show'); }, 2400);
  }
  function openModal(options) {
    state.modal = {
      title: options.title,
      body: options.body,
      okText: options.okText,
      cancelText: options.cancelText === undefined ? '取消' : options.cancelText,
      danger: !!options.danger,
      onOk: options.onOk || function () {}
    };
    renderOverlays();
  }
  function closeModal() { state.modal = null; renderOverlays(); }
  function closeDrawer() { state.drawer = null; renderOverlays(); }
  function go(screen) { state.screen = screen; window.scrollTo(0, 0); render(); }

  function startElapsedTimer() {
    stopElapsedTimer();
    state.elapsedTimer = setInterval(function () {
      var element = $('#elapsed');
      if (!element || !state.run || state.run.status !== 'running') return;
      element.textContent = fmtClock(Date.now() - state.run.startedAt);
    }, 1000);
  }
  function stopElapsedTimer() {
    if (state.elapsedTimer) { clearInterval(state.elapsedTimer); state.elapsedTimer = null; }
  }

  /* ---------- 图片压缩 ---------- */
  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('图片读取失败')); };
      reader.onload = function () {
        var image = new Image();
        image.onerror = function () { reject(new Error('图片解析失败')); };
        image.onload = function () {
          var maxEdge = 1600;
          var width = image.naturalWidth;
          var height = image.naturalHeight;
          var scale = Math.min(1, maxEdge / Math.max(width, height));
          var canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(width * scale));
          canvas.height = Math.max(1, Math.round(height * scale));
          var context = canvas.getContext('2d');
          context.fillStyle = '#ffffff';
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          var quality = 0.86;
          var dataUrl = canvas.toDataURL('image/jpeg', quality);
          while (dataUrl.length * 0.75 > 1024 * 1024 && quality > 0.4) {
            quality -= 0.08;
            dataUrl = canvas.toDataURL('image/jpeg', quality);
          }
          resolve({
            dataUrl: dataUrl,
            width: canvas.width,
            height: canvas.height,
            bytes: Math.round(dataUrl.length * 0.75)
          });
        };
        image.src = String(reader.result);
      };
      reader.readAsDataURL(file);
    });
  }

  /* ---------- 拆疑点请求 ---------- */
  function requestPreview(body, meta) {
    state.analyzing = true;
    state.preview = null;
    state.selected = {};
    state.screen = 'preview';
    state.error = '';
    window.scrollTo(0, 0);
    render();

    var controller = new AbortController();
    state.analyzeCtrl = controller;
    var timer = setTimeout(function () { controller.abort(); }, 120000);

    fetch('/api/extract-claims', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify(body),
      signal: controller.signal
    }).then(function (response) {
      return response.json().catch(function () { return null; }).then(function (data) {
        if (!response.ok) {
          throw new ApiError(response.status, (data && (data.message || data.error)) || ('接口返回 HTTP ' + response.status));
        }
        return data;
      });
    }).then(function (preview) {
      if (state.analyzeCtrl !== controller) return;
      state.preview = preview;
      state.analyzing = false;
      state.selected = {};
      (preview.claims || []).forEach(function (claim) {
        if (claim.riskLevel === 'high') state.selected[claim.id] = true;
      });
      if (!Object.keys(state.selected).length && preview.claims && preview.claims.length === 1) {
        state.selected[preview.claims[0].id] = true;
      }
      render();
    }).catch(function (error) {
      if (state.analyzeCtrl !== controller) return;
      state.analyzing = false;
      state.preview = null;
      state.screen = meta.returnScreen || 'home';
      state.error = error && error.name === 'AbortError'
        ? '拆疑点请求超时或已取消，请重试。'
        : (error && error.message ? error.message : '拆疑点失败，请重试。');
      render();
      toast(state.error);
    }).finally(function () {
      clearTimeout(timer);
      if (state.analyzeCtrl === controller) state.analyzeCtrl = null;
    });
  }

  function handleSubmit() {
    state.error = '';
    if (state.inputType === 'link') {
      state.error = '链接立案尚未接入，请切换到「文字」粘贴正文。';
      render();
      return;
    }
    if (state.inputType === 'image') {
      if (!state.draft.image) {
        state.error = '请先上传一张截图。';
        render();
        return;
      }
      requestPreview({ mode: state.mode, inputType: 'image', image: state.draft.image }, { returnScreen: 'home' });
      return;
    }
    var text = state.draft.text.trim();
    var min = state.mode === 'scriptcheck' ? 50 : 4;
    var max = state.mode === 'scriptcheck' ? 1500 : 500;
    if (text.length < min) {
      state.error = state.mode === 'scriptcheck' ? '文案体检至少 50 个字，请把整段文案贴进来。' : '至少输入 4 个字。';
      render();
      return;
    }
    if (text.length > max) {
      state.error = '最多 ' + max + ' 个字。';
      render();
      return;
    }
    if (state.mode === 'factcheck') {
      startCase({ inputType: 'text', text: text, mode: 'factcheck' }, { mode: 'factcheck', input: text });
      return;
    }
    requestPreview({ mode: 'scriptcheck', inputType: 'text', text: text }, { returnScreen: 'home' });
  }

  /* ---------- 立案与事件流 ---------- */
  function startCase(body, meta) {
    if (state.run && state.run.controller) {
      try { state.run.controller.abort(); } catch (e) {}
    }
    stopElapsedTimer();
    var run = newRun(meta || {});
    run.lastBody = body;
    state.run = run;
    state.screen = 'case';
    state.expanded = {};
    state.timelineClaim = null;
    state.drawer = null;
    state.modal = null;
    window.scrollTo(0, 0);
    render();
    startElapsedTimer();
    consumeStream(body, run);
  }

  function consumeStream(body, run) {
    var controller = new AbortController();
    run.controller = controller;
    var timeout = setTimeout(function () {
      run.timedOut = true;
      try { controller.abort(); } catch (e) {}
    }, 165000);

    fetch('/api/investigate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'text/event-stream' },
      body: JSON.stringify(body),
      signal: controller.signal
    }).then(function (response) {
      if (!response.ok) {
        return response.json().catch(function () { return null; }).then(function (data) {
          throw new ApiError(response.status, (data && (data.message || data.error)) || ('立案失败（HTTP ' + response.status + '）'));
        });
      }
      if (!response.body) throw new Error('响应没有事件流');
      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';
      function pump() {
        return reader.read().then(function (result) {
          if (result.done) return;
          buffer += decoder.decode(result.value, { stream: true });
          buffer = drainSse(buffer, function (event) {
            applyEvent(run, event);
            if (event.type === 'done') {
              stopElapsedTimer();
              scheduleRender();
              setTimeout(function () {
                var element = $('#verdict-anchor');
                if (element) element.scrollIntoView({ behavior: 'smooth', block: 'start' });
              }, 240);
            } else if (event.type === 'verdict' || event.type === 'source' || event.type === 'source_update' ||
                       event.type === 'groups' || event.type === 'stage' || event.type === 'claims' ||
                       event.type === 'stats' || event.type === 'billing' || event.type === 'error') {
              scheduleRender();
            }
          });
          return pump();
        });
      }
      return pump().then(function () {
        buffer += decoder.decode();
        if (buffer.trim() !== '') drainSse(buffer + '\n\n', function (event) { applyEvent(run, event); });
        scheduleRender();
        if (run.status === 'running' && !run.terminated) {
          run.status = 'error';
          run.fatal = '事件流意外结束，没有等到结案报告。';
          run.closedAt = Date.now();
          stopElapsedTimer();
          scheduleRender();
        }
      });
    }).catch(function (error) {
      if (run.terminated) return;
      if (run.status === 'done') return;
      if (error && error.name === 'AbortError') {
        if (run.timedOut) {
          run.status = 'error';
          run.fatal = '查证超时：服务端在 150 秒内没有返回完整结案报告，请稍后重试。';
        } else if (!run.terminated) {
          run.status = 'error';
          run.fatal = '事件流已中断。';
        }
      } else {
        run.status = 'error';
        run.fatal = error instanceof ApiError
          ? error.message
          : (error instanceof TypeError ? '网络连接中断，请确认本地服务仍在运行。' : (error && error.message) || '立案失败。');
      }
      run.closedAt = Date.now();
      stopElapsedTimer();
      scheduleRender();
    }).finally(function () {
      clearTimeout(timeout);
      if (run.controller === controller) run.controller = null;
    });
  }

  function terminateRun() {
    var run = state.run;
    if (!run || run.status !== 'running') return;
    run.terminated = true;
    run.status = 'terminated';
    run.closedAt = Date.now();
    if (run.controller) { try { run.controller.abort(); } catch (e) {} }
    stopElapsedTimer();
    state.modal = null;
    render();
    toast('已中止，在途请求已取消');
  }

  /* ---------- 导出 Markdown ---------- */
  function mdFromCaseFile(caseFile) {
    if (!caseFile) return '';
    var lines = [];
    var modeLabel = caseFile.mode === 'scriptcheck' ? '文案体检' : '消息查证';
    lines.push('# AI 侦探社 · ' + (caseFile.mode === 'scriptcheck' ? '文案体检报告' : '查证报告'), '');
    lines.push('- 案件编号：' + caseFile.id);
    lines.push('- 生成时间：' + fmtDateTime(caseFile.createdAt));
    lines.push('- 模式：' + modeLabel);
    lines.push('- 原始输入：' + String(caseFile.input || '').replace(/\s+/g, ' ').trim(), '');
    var verdict = caseFile.verdict;
    lines.push('## 结论', '');
    if (verdict) {
      lines.push('**' + (VERDICTS[verdict.level] || {}).label + '**：' + verdict.headline, '');
      lines.push(verdict.summary || '', '');
      lines.push('置信度 ' + Math.round((Number(verdict.confidence) || 0) * 100) + '%', '');
    } else {
      lines.push('本次未能生成判决结论。', '');
    }
    var sourceById = {};
    (caseFile.sources || []).forEach(function (source) { sourceById[source.id] = source; });
    lines.push('## 疑点结论', '');
    (caseFile.claims || []).forEach(function (claim, index) {
      var item = (verdict && verdict.claims || []).filter(function (entry) { return entry.claimId === claim.id; })[0];
      lines.push('### ' + (index + 1) + '. ' + (claim.sentence || claim.text), '');
      if (!item) {
        lines.push('- 判决：本次未生成结论', '');
        return;
      }
      lines.push('- 判决：' + (VERDICTS[item.level] || {}).label + '（置信度 ' + Math.round((Number(item.confidence) || 0) * 100) + '%）');
      lines.push('- 说明：' + (item.summary || ''));
      if (item.scriptLabel) lines.push('- 标签：' + (SCRIPT_LABELS[item.scriptLabel] || item.scriptLabel));
      if (item.rewrite) lines.push('- 改写建议：' + item.rewrite);
      (item.citationIds || []).forEach(function (id) {
        var source = sourceById[id];
        if (source) lines.push('- 来源：[' + titleLabel(source) + '](<' + source.url + '>) · ' + siteLabel(source));
      });
      lines.push('');
    });
    lines.push('## 来源列表', '');
    (caseFile.sources || []).forEach(function (source) {
      lines.push('- [' + (source.tier ? TIERS[source.tier].label : '未分级') + '] [' + titleLabel(source) + '](<' + source.url + '>) · ' + siteLabel(source) + ' · ' + fmtDate(source.publishedAt));
    });
    lines.push('', '## 传播时间线', '');
    var timelineCount = 0;
    (caseFile.claims || []).forEach(function (claim) {
      var steps = (caseFile.timelines || {})[claim.id] || [];
      if (!steps.length) return;
      timelineCount += 1;
      lines.push('### ' + (claim.sentence || claim.text), '');
      steps.forEach(function (step, index) {
        var source = sourceById[step.sourceId];
        lines.push((index + 1) + '. ' + fmtDateTime(step.publishedAt) + ' · ' + (source ? siteLabel(source) : step.sourceId));
        lines.push('> ' + (step.quote || '').replace(/\n/g, '\n> '));
        if (step.mutation) lines.push('- 变形：' + step.mutation);
        lines.push('');
      });
    });
    if (!timelineCount) lines.push('本次未还原出传播时间线。');
    if (caseFile.billing) {
      lines.push('', '## 结算', '');
      lines.push('- 单价：' + caseFile.billing.pricePerClaim + ' 积分 / 疑点');
      lines.push('- 查证疑点：' + (caseFile.billing.checkedClaimIds || []).length + ' 个');
      lines.push('- 扣除：' + (caseFile.billing.charged || 0) + ' 积分');
      lines.push('- 退回：' + (caseFile.billing.refunded || 0) + ' 积分');
    }
    if (verdict && verdict.rebuttalCard) {
      lines.push('', '## 辟谣卡', '', verdict.rebuttalCard.title, '', verdict.rebuttalCard.body);
    }
    return lines.join('\n').trimEnd() + '\n';
  }

  function exportMarkdown() {
    var run = state.run;
    if (!run) return;
    var caseFile = run.caseFile || {
      id: run.caseId || 'local-case',
      input: run.input,
      mode: run.mode,
      createdAt: new Date(run.startedAt).toISOString(),
      claims: run.claims,
      sources: run.sources,
      groups: run.groups,
      timelines: run.timelines,
      verdict: run.verdict,
      stats: run.stats,
      billing: run.billing
    };
    var markdown = mdFromCaseFile(caseFile);
    var blob = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });
    var anchor = document.createElement('a');
    anchor.href = URL.createObjectURL(blob);
    anchor.download = '查证报告-' + (caseFile.id || 'local-case') + '.md';
    document.body.appendChild(anchor);
    anchor.click();
    setTimeout(function () { URL.revokeObjectURL(anchor.href); anchor.remove(); }, 400);
    toast('Markdown 报告已导出');
  }

  function copyRebuttal() {
    var run = state.run;
    if (!run || !run.verdict || !run.verdict.rebuttalCard) return;
    var card = run.verdict.rebuttalCard;
    var level = (VERDICTS[run.verdict.level] || {}).label || '';
    var text = card.title + '\n' + card.body + '\n—— AI 侦探社 · 判决：' + level + '（置信度 ' + Math.round((Number(run.verdict.confidence) || 0) * 100) + '%）';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('辟谣卡已复制'); }).catch(function () { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text) {
    try {
      var textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      textarea.remove();
      toast('辟谣卡已复制');
    } catch (e) { toast('复制失败，请手动选择文字'); }
  }

  /* ---------- 事件绑定 ---------- */
  document.addEventListener('click', function (event) {
    var target = event.target.closest('[data-act]');
    if (!target) return;
    var act = target.getAttribute('data-act');
    var id = target.getAttribute('data-id');

    if (act === 'mode') {
      if (state.mode === id) return;
      state.mode = id;
      state.error = '';
      render();
      return;
    }
    if (act === 'input-type') {
      state.inputType = id;
      state.error = '';
      render();
      return;
    }
    if (act === 'example') {
      var list = EXAMPLES[state.mode] || [];
      if (list[Number(id)]) {
        state.draft.text = list[Number(id)];
        state.error = '';
        render();
        var textarea = $('#intake-text');
        if (textarea) { textarea.focus(); textarea.setSelectionRange(textarea.value.length, textarea.value.length); }
      }
      return;
    }
    if (act === 'submit') { handleSubmit(); return; }
    if (act === 'clear-image') {
      state.draft.image = '';
      state.draft.imageMeta = null;
      render();
      return;
    }
    if (act === 'home') {
      if (state.run && state.run.status === 'running') {
        openModal({
          title: '中止查证并返回首页？',
          body: '返回首页会中止本次查证，在途的搜索与模型请求会立即取消，本次不计费。',
          okText: '中止并返回',
          danger: true,
          onOk: function () {
            terminateRun();
            state.run = null;
            state.modal = null;
            state.draft.text = '';
            state.draft.url = '';
            state.draft.image = '';
            state.draft.imageMeta = null;
            state.preview = null;
            state.selected = {};
            state.screen = 'home';
            render();
            window.scrollTo(0, 0);
          }
        });
        return;
      }
      state.draft.text = '';
      state.draft.url = '';
      state.draft.image = '';
      state.draft.imageMeta = null;
      state.preview = null;
      state.selected = {};
      state.error = '';
      state.run = null;
      state.screen = 'home';
      scheduleRender();
      window.scrollTo(0, 0);
      return;
    }
    if (act === 'back-home') { state.preview = null; state.selected = {}; state.screen = 'home'; render(); window.scrollTo(0, 0); return; }
    if (act === 'cancel-analyze') {
      if (state.analyzeCtrl) { try { state.analyzeCtrl.abort(); } catch (e) {} }
      state.analyzeCtrl = null;
      state.analyzing = false;
      state.preview = null;
      state.screen = 'home';
      state.error = '';
      render();
      return;
    }
    if (act === 'toggle-claim') {
      if (state.selected[id]) delete state.selected[id];
      else {
        if (Object.keys(state.selected).length >= 10) { toast('单次最多查证 10 个疑点'); return; }
        state.selected[id] = true;
      }
      render();
      return;
    }
    if (act === 'select-high') {
      state.selected = {};
      ((state.preview && state.preview.claims) || []).forEach(function (claim) {
        if (claim.riskLevel === 'high' && Object.keys(state.selected).length < 10) state.selected[claim.id] = true;
      });
      render();
      return;
    }
    if (act === 'select-all') {
      state.selected = {};
      ((state.preview && state.preview.claims) || []).slice(0, 10).forEach(function (claim) { state.selected[claim.id] = true; });
      if (state.preview && state.preview.claims.length > 10) toast('最多同时查证 10 个疑点');
      render();
      return;
    }
    if (act === 'select-none') { state.selected = {}; render(); return; }
    if (act === 'start-selected') {
      var preview = state.preview;
      if (!preview) return;
      var ids = Object.keys(state.selected);
      if (!ids.length) { toast('请至少勾选一个疑点'); return; }
      var body = {
        mode: preview.mode,
        inputType: 'text',
        text: preview.input,
        previewId: preview.previewId,
        selectedClaimIds: ids
      };
      startCase(body, { mode: preview.mode, input: preview.input, inputImage: preview.inputType === 'image' ? state.draft.image : null });
      return;
    }
    if (act === 'open-history') {
      var caseFile = (state.history || []).filter(function (item) { return item.id === id; })[0];
      if (!caseFile) { toast('找不到该卷宗'); return; }
      stopElapsedTimer();
      state.run = runFromCaseFile(caseFile);
      state.expanded = {};
      state.timelineClaim = null;
      state.screen = 'case';
      window.scrollTo(0, 0);
      render();
      return;
    }
    if (act === 'clear-history') {
      openModal({
        title: '清空本机历史卷宗？',
        body: '只会删除浏览器里保存的卷宗记录，不会删除服务端已生成的报告。',
        okText: '确认清空',
        danger: true,
        onOk: function () {
          try { localStorage.removeItem(HISTORY_KEY); } catch (e) {}
          state.history = [];
          state.modal = null;
          render();
          toast('历史卷宗已清空');
        }
      });
      return;
    }
    if (act === 'terminate') {
      openModal({
        title: '中止本次查证？',
        body: '会立即取消在途的搜索与模型请求。服务端会按未完成处理，本次不计费。',
        okText: '确认中止',
        danger: true,
        onOk: terminateRun
      });
      return;
    }
    if (act === 'retry-run') {
      if (!state.run || !state.run.lastBody) return;
      startCase(state.run.lastBody, { mode: state.run.mode, input: state.run.input, inputImage: state.run.inputImage });
      return;
    }
    if (act === 'expand-claim') { state.expanded[id] = true; render(); return; }
    if (act === 'timeline-tab') { state.timelineClaim = id; render(); return; }
    if (act === 'open-source') { state.drawer = { sourceId: id }; renderOverlays(); return; }
    if (act === 'switch-source') { state.drawer = { sourceId: id }; renderOverlays(); return; }
    if (act === 'close-drawer') { closeDrawer(); return; }
    if (act === 'copy-rebuttal') { copyRebuttal(); return; }
    if (act === 'export-md') { exportMarkdown(); return; }
    if (act === 'modal-ok') {
      var callback = state.modal && state.modal.onOk;
      state.modal = null;
      if (callback) callback();
      renderOverlays();
      return;
    }
    if (act === 'modal-cancel') { closeModal(); return; }
  });

  document.addEventListener('input', function (event) {
    if (event.target.id === 'intake-text') {
      state.draft.text = event.target.value;
      var counter = $('#char-count');
      if (counter) {
        var max = state.mode === 'scriptcheck' ? 1500 : 500;
        counter.textContent = state.draft.text.length + ' / ' + max;
      }
    } else if (event.target.id === 'link-url') {
      state.draft.url = event.target.value;
    }
  });

  document.addEventListener('change', function (event) {
    if (event.target.id !== 'image-file') return;
    var file = event.target.files && event.target.files[0];
    if (!file) return;
    if (!/^image\//.test(file.type)) { toast('请选择图片文件'); return; }
    if (file.size > 12 * 1024 * 1024) { toast('图片不要超过 12MB'); return; }
    toast('正在压缩截图…');
    compressImage(file).then(function (result) {
      state.draft.image = result.dataUrl;
      state.draft.imageMeta = result;
      state.error = '';
      render();
      toast('截图已压缩到 ' + Math.round(result.bytes / 1024) + 'KB');
    }).catch(function (error) {
      toast(error.message || '图片处理失败');
    });
  });

  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Escape') return;
    if (state.modal) closeModal();
    else if (state.drawer) closeDrawer();
  });

  /* ---------- 启动 ---------- */
  function renderBlocked() {
    $('#app').innerHTML = '<div class="wrap"><section class="card blocked">' +
      '<h1>需要本地服务才能查证</h1>' +
      '<p>你当前是直接双击打开 HTML 文件（file:// 协议）。浏览器的同源策略会阻止页面调用真实接口，所以本页必须由 Next.js 服务提供。</p>' +
      '<pre>cd /Users/yunfanai/vibe_coding/yuanbao_zhentan\npnpm dev\n\n# 然后打开：\nhttp://localhost:3000/index.html</pre>' +
      '<ol><li>确认 <code>.env.local</code> 中的 <code>USE_MOCK=false</code>。</li>' +
      '<li>启动后访问 <code>/index.html</code>，不要用 file:// 打开。</li>' +
      '<li>如果端口不是 3000，请以终端输出的地址为准。</li></ol>' +
      '<p style="margin-top:10px">完整版应用：<a href="http://localhost:3000/">http://localhost:3000/</a></p>' +
    '</section></div>';
  }

  if (location.protocol === 'file:') {
    renderBlocked();
  } else {
    state.history = loadHistory();
    render();
  }
})();
</script>
</body>
